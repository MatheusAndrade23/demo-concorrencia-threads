services:
  postgres:
    image: postgres:17-alpine
    container_name: demo-concorrencia-pg
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: banco
    ports:
      # 5433 no host para não brigar com um Postgres já instalado na máquina
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d banco"]
      interval: 2s
      timeout: 3s
      retries: 20
    command:
      - postgres
      # os cenários abrem vários pools ao mesmo tempo; o padrão de 100 aperta
      - -c
      - max_connections=300
      # detecta o deadlock do cenário 09 rápido, para não travar a apresentação
      - -c
      - deadlock_timeout=200ms
      - -c
      - log_lock_waits=on

volumes:
  pgdata:
